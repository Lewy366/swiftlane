# The Swiftlane iPhone app. GitHub builds it on a Mac (see .github/workflows/iphone.yml):
#   xcodegen generate   # makes Swiftlane.xcodeproj from this file
name: Swiftlane
options:
  bundleIdPrefix: io.github.lewy366
  deploymentTarget:
    iOS: "16.0"
targets:
  Swiftlane:
    type: application
    platform: iOS
    sources: [Swiftlane]
    info:
      path: Swiftlane/Info.plist
      properties:
        CFBundleDisplayName: Swiftlane
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "To scan the QR code shown on your PC, so this iPhone can pair with Swiftlane."
        NSLocalNetworkUsageDescription: "To talk to Swiftlane on your PC over your home network. Nothing leaves your network."
        # Plain http is allowed only to your own network (private addresses and .local names), never the internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lewy366.swiftlane
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGNING_ALLOWED: false
