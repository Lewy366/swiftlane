[package]
name = "swiftlane"
version = "2.3.3"
description = "Swiftlane: phone transfer, share links and everyday tools for Windows"
edition = "2021"
publish = false
default-run = "swiftlane"

[[bin]]
name = "swiftlane"
path = "src/main.rs"

[[bin]]
name = "swiftlane-pack"
path = "src/bin/swiftlane-pack.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
tauri-plugin-notification = "2"
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "net", "sync", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
socket2 = "0.5"
hmac = "0.12"
constant_time_eq = "0.3"
percent-encoding = "2"
mime_guess = "2"
fs4 = { version = "0.13", features = ["sync"] }
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
dirs = "6"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
x509-parser = "0.16"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
time = "0.3"
uuid = { version = "1", features = ["v5"] }
scrypt = { version = "0.11", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
aes-gcm = "0.10"
zeroize = "1"
# PDF tools: lopdf (pure Rust) re-assembles pages; PDFium (pdfium.dll shipped next to the exe,
# loaded at run time) draws them. pdfium_7543: works with pdfium-binaries chromium/7543 or newer.
lopdf = { version = "0.47", default-features = false }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7543", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
jpeg-encoder = "0.7"
libwebp-sys = "0.14"
iroh = "1.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_System_Power", "Win32_Storage_FileSystem"] }
# the Recycle Bin (IFileOperation, with a check that nothing is ever deleted for good)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Networking_NetworkListManager"] }
windows-core = "0.62"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }

# The vault's password check (scrypt) and encryption are slow without optimisation, even in test builds.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
