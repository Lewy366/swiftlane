<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swiftlane Setup</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<style>
  body { overflow: hidden; }
  /* The window has a fixed size: the row is pinned to it, so a long step scrolls inside .pane and the buttons stay visible. */
  .wizard { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: 236px 1fr; grid-template-rows: minmax(0, 1fr); }
  .steps-bar { padding: 22px 16px; border-right: 1px solid var(--border); background: var(--pane-side); display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow-y: auto; }
  .steps-bar .brand { padding: 2px 4px 20px; display: flex; align-items: center; gap: 11px; }
  .steps-bar .brand-mark { width: 34px; height: 34px; flex-shrink: 0; display: block; }
  .steps-bar .brand-mark .wm-l { fill: var(--violet); }
  .steps-bar .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
  .steps-bar .brand-word { font: 700 14.5px/1.1 var(--display); letter-spacing: .12em; color: var(--text); }
  .steps-bar .brand-word span { font-weight: 400; color: var(--accent); }
  .steps-bar .brand small { font-size: 11.5px; color: var(--faint); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .step-item { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; color: var(--faint); font-weight: 550; font-size: 13.5px; }
  .step-item i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11.5px; font-variant-numeric: tabular-nums;
                 border: 1.5px solid var(--faint); flex-shrink: 0; }
  .step-item.on { color: var(--text); background: var(--nav-active); }
  .step-item.on i { border-color: transparent; background: var(--violet); color: var(--on-accent); font-weight: 650; }
  .step-item.done { color: var(--muted); }
  .step-item.done i { border-color: var(--ok); color: var(--ok); }
  .steps-bar .spacer { flex: 1; }
  .lang { margin-top: 10px; }
  .content { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 28px 34px 12px; }
  .footer { flex-shrink: 0; }
  .pane::-webkit-scrollbar { width: 8px; }
  .pane::-webkit-scrollbar-button { display: none; height: 0; }
  .pane::-webkit-scrollbar-track { background: transparent; }
  .pane::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 18%, transparent); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  .pane:hover::-webkit-scrollbar-thumb { background-color: color-mix(in srgb, var(--text) 30%, transparent); }
  .pane h1 { font: 650 25px/1.15 var(--display); margin: 0 0 6px; letter-spacing: -.02em; }
  .pane > p.lead { color: var(--muted); margin: 0 0 22px; }
  .footer { display: flex; align-items: center; gap: 10px; padding: 14px 34px 18px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--pane-side) 84%, transparent); }
  .footer .spacer { flex: 1; }
  .path-row { display: flex; gap: 8px; }
  .path-row .input { font-family: var(--mono); font-size: 13px; }
  .opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .opt:first-of-type { border-top: 0; }
  .opt > div { flex: 1; min-width: 0; }
  .opt > .seg { flex: 0 0 auto; }
  .opt.opt-bar { align-items: center; }
  .opt b { display: block; font-weight: 550; }
  .opt small { color: var(--muted); font-size: 12.5px; display: block; margin-top: 1px; }
  .tree { font: 12.5px/1.7 var(--mono); color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 8px; }
  .hero { text-align: center; padding-top: 24px; }
  .hero-mark { width: 88px; height: 88px; margin: 0 auto; display: block; filter: drop-shadow(0 8px 18px rgba(0,0,0,.32)); }
  .hero-mark .wm-l { fill: var(--violet); }
  .hero h1 { font-size: 30px; margin-top: 18px; letter-spacing: -.025em; }
  .hero .lead { max-width: 520px; margin: 10px auto 0; line-height: 1.55; }
  .summary { display: grid; grid-template-columns: 168px 1fr; gap: 8px 16px; font-size: 13.5px; }
  .summary dt { color: var(--muted); } .summary dd { margin: 0; overflow-wrap: anywhere; }
  .big-progress { height: 10px; border-radius: 10px; background: var(--surface-2); overflow: hidden; margin: 26px 0 12px; }
  .big-progress i { display: block; height: 100%; width: 0; background: var(--violet); transition: width .3s; }
  .result-icon { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 20px auto 16px; font-size: 34px; }
  .result-icon.ok { background: rgba(61,220,151,.15); color: var(--ok); } .result-icon.bad { background: rgba(255,93,115,.15); color: var(--err); }
  .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; }
  .feature-grid .opt:nth-child(-n+2) { border-top: 0; }
</style>
</head>

<div class="wizard">
  <aside class="steps-bar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 256 256" role="img" aria-label="Swiftlane">
        <rect x="8" y="8" width="240" height="240" rx="54" fill="#0e121c" stroke="rgba(255,255,255,.16)" stroke-width="5"/>
        <path class="wm-l" d="M 152 60 H 178 V 166 H 218 L 205 194 H 152 Z"/>

        <path fill="#f3f5f8" d="M 136 60 H 82 C 52 60 38 76 38 98 C 38 120 52 134 82 138 L 120 143 C 130 145 134 150 134 157 C 134 165 126 168 112 168 H 50 L 38 194 H 114 C 146 194 162 178 162 155 C 162 131 146 119 114 115 L 80 110 C 70 108 66 104 66 97 C 66 90 72 86 86 86 H 126 Z"/>
      </svg>
      <div class="brand-text">
        <span class="brand-word" translate="no"><b>SWIFT</b><span>LANE</span></span>
        <small id="ver"></small>
      </div>
    </div>
    <div id="stepList"></div>
    <div class="spacer"></div>
    <select class="input lang" id="language" title="Language"><option value="en">English</option><option value="de">Deutsch</option><option value="pl">Polski</option><option value="it">Italiano</option></select>
  </aside>
  <section class="content">
    <div class="pane" id="pane"></div>
    <div class="footer" id="footer">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <span class="spacer"></span>
      <button class="btn" id="backBtn">Back</button>
      <button class="btn primary" id="nextBtn">Next</button>
    </div>
  </section>
