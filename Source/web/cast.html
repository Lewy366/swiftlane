<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Show this screen · Swiftlane</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f3f8; --card: #fff; --text: #17161d; --muted: #66647a; --line: #e2e0ea; --accent: #0ea5cf; --err: #d93a37; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0e16; --card: #1a1924; --text: #f1f0f6; --muted: #a09eb3; --line: #2c2a3a; --accent: #14b8e0; --err: #f0605d; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 15px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif; padding: 16px; }
  .card { width: min(460px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  .brand { font: italic 700 13px/1 Bahnschrift, "Segoe UI", sans-serif; letter-spacing: .08em; color: var(--accent); margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 18px 0 6px; }
  input { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  button { margin-top: 18px; width: 100%; font: 600 15px/1 inherit; font-family: inherit; border: 0; border-radius: 12px; padding: 14px; cursor: pointer; background: var(--accent); color: #fff; }
  button.stop { background: transparent; color: var(--err); border: 1px solid var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin-top: 16px; font-size: 14px; min-height: 1.5em; }
  .status.err { color: var(--err); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
  small { display: block; margin-top: 18px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">SWIFTLANE</div>
  <h1 data-t>Show this screen on the PC</h1>
  <p data-t>Your screen goes straight to the PC over your home network, encrypted. The PC asks first.</p>
  <label for="name" data-t>Name the PC will show</label>
  <input id="name" maxlength="40" autocomplete="off">
  <button id="go" data-t>Share screen</button>
  <div class="status" id="status" role="status"></div>
  <small data-t>Your browser asks what to share: the whole screen, one window or one tab. With the whole screen or a tab, you can also share its sound.</small>
</main>
<script>
(() => {
  const T = {
    de: { 'Show this screen on the PC': 'Diesen Bildschirm auf dem PC zeigen', 'Your screen goes straight to the PC over your home network, encrypted. The PC asks first.': 'Dein Bildschirm geht direkt und verschlüsselt über dein Heimnetz zum PC. Der PC fragt vorher.', 'Name the PC will show': 'Name, den der PC anzeigt', 'Share screen': 'Bildschirm teilen', 'Stop sharing': 'Teilen beenden', 'Your browser asks what to share: the whole screen, one window or one tab. With the whole screen or a tab, you can also share its sound.': 'Dein Browser fragt, was geteilt wird: der ganze Bildschirm, ein Fenster oder ein Tab. Beim ganzen Bildschirm oder einem Tab geht auch der Ton mit.', 'Waiting for the PC to allow it…': 'Warte, bis der PC es erlaubt …', 'Connecting…': 'Verbinde …', 'Showing on the PC': 'Wird auf dem PC gezeigt', 'The PC said no.': 'Der PC hat abgelehnt.', 'Nobody answered on the PC. Try again.': 'Am PC hat niemand geantwortet. Versuch es noch einmal.', 'Stopped.': 'Beendet.', 'The connection to the PC was lost.': 'Die Verbindung zum PC ist abgebrochen.', 'This browser can\'t share its screen. Use Chrome, Edge, Firefox or Safari on a computer.': 'Dieser Browser kann seinen Bildschirm nicht teilen. Nimm Chrome, Edge, Firefox oder Safari auf einem Computer.', 'Open the secure link (https://) that Swiftlane shows.': 'Öffne den sicheren Link (https://), den Swiftlane anzeigt.', 'This link is incomplete. Open the whole link that Swiftlane shows.': 'Dieser Link ist unvollständig. Öffne den ganzen Link, den Swiftlane anzeigt.' },
    pl: { 'Show this screen on the PC': 'Pokaż ten ekran na komputerze', 'Your screen goes straight to the PC over your home network, encrypted. The PC asks first.': 'Ekran trafia prosto do komputera przez sieć domową, zaszyfrowany. Komputer najpierw pyta.', 'Name the PC will show': 'Nazwa widoczna na komputerze', 'Share screen': 'Udostępnij ekran', 'Stop sharing': 'Zakończ udostępnianie', 'Your browser asks what to share: the whole screen, one window or one tab. With the whole screen or a tab, you can also share its sound.': 'Przeglądarka zapyta, co udostępnić: cały ekran, jedno okno lub kartę. Przy całym ekranie lub karcie można też udostępnić dźwięk.', 'Waiting for the PC to allow it…': 'Czekam na zgodę komputera…', 'Connecting…': 'Łączenie…', 'Showing on the PC': 'Wyświetlane na komputerze', 'The PC said no.': 'Komputer odmówił.', 'Nobody answered on the PC. Try again.': 'Nikt nie odpowiedział na komputerze. Spróbuj ponownie.', 'Stopped.': 'Zakończono.', 'The connection to the PC was lost.': 'Połączenie z komputerem zostało przerwane.', 'This browser can\'t share its screen. Use Chrome, Edge, Firefox or Safari on a computer.': 'Ta przeglądarka nie umie udostępniać ekranu. Użyj Chrome, Edge, Firefoksa lub Safari na komputerze.', 'Open the secure link (https://) that Swiftlane shows.': 'Otwórz bezpieczny link (https://) pokazany przez Swiftlane.', 'This link is incomplete. Open the whole link that Swiftlane shows.': 'Ten link jest niepełny. Otwórz cały link pokazany przez Swiftlane.' },
    it: { 'Show this screen on the PC': 'Mostra questo schermo sul PC', 'Your screen goes straight to the PC over your home network, encrypted. The PC asks first.': 'Lo schermo arriva direttamente al PC tramite la rete di casa, cifrato. Il PC chiede prima.', 'Name the PC will show': 'Nome mostrato sul PC', 'Share screen': 'Condividi schermo', 'Stop sharing': 'Interrompi condivisione', 'Your browser asks what to share: the whole screen, one window or one tab. With the whole screen or a tab, you can also share its sound.': 'Il browser chiede cosa condividere: tutto lo schermo, una finestra o una scheda. Con tutto lo schermo o una scheda puoi condividere anche l’audio.', 'Waiting for the PC to allow it…': 'In attesa del permesso del PC…', 'Connecting…': 'Connessione…', 'Showing on the PC': 'In riproduzione sul PC', 'The PC said no.': 'Il PC ha rifiutato.', 'Nobody answered on the PC. Try again.': 'Nessuno ha risposto sul PC. Riprova.', 'Stopped.': 'Interrotto.', 'The connection to the PC was lost.': 'La connessione con il PC si è interrotta.', 'This browser can\'t share its screen. Use Chrome, Edge, Firefox or Safari on a computer.': 'Questo browser non può condividere lo schermo. Usa Chrome, Edge, Firefox o Safari su un computer.', 'Open the secure link (https://) that Swiftlane shows.': 'Apri il link sicuro (https://) mostrato da Swiftlane.', 'This link is incomplete. Open the whole link that Swiftlane shows.': 'Questo link è incompleto. Apri il link completo mostrato da Swiftlane.' },
  };
  const dict = T[(navigator.language || 'en').slice(0, 2)] || {};
  const t = s => dict[s] || s;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.textContent));
  document.documentElement.lang = (navigator.language || 'en').slice(0, 2);

  const $ = id => document.getElementById(id);
  const token = decodeURIComponent(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);   // keep the code out of the history and address bar
  const say = (text, bad) => { $('status').textContent = t(text); $('status').className = 'status' + (bad ? ' err' : ''); };
  const showing = () => { $('status').innerHTML = ''; const d = document.createElement('span'); d.className = 'dot'; $('status').append(d, t('Showing on the PC')); $('status').className = 'status'; };

  let name = '';
  try { name = localStorage.getItem('swiftlane-cast-name') || ''; } catch (e) {}
  if (!name) { const ua = navigator.userAgent; name = /Mac/.test(ua) ? 'Mac' : /CrOS/.test(ua) ? 'Chromebook' : /Linux/.test(ua) ? 'Linux computer' : /Windows/.test(ua) ? 'Windows laptop' : 'Laptop'; }
  $('name').value = name;

  let pc = null, stream = null;
  const supported = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  if (!window.isSecureContext) { say('Open the secure link (https://) that Swiftlane shows.', true); $('go').disabled = true; }
  else if (!supported) { say('This browser can\'t share its screen. Use Chrome, Edge, Firefox or Safari on a computer.', true); $('go').disabled = true; }
  else if (!token) { say('This link is incomplete. Open the whole link that Swiftlane shows.', true); $('go').disabled = true; }

  let castId = null;
  function tellPcEnded() {   // so the PC closes its window straight away
    if (!castId) return;
    fetch('/api/cast/end?id=' + encodeURIComponent(castId), { method: 'POST', keepalive: true, headers: { 'X-Cast-Token': token } }).catch(() => {});
    castId = null;
  }
  addEventListener('pagehide', tellPcEnded);

  function stop(text, bad) {
    tellPcEnded();
    if (stream) stream.getTracks().forEach(tr => tr.stop());
    if (pc) pc.close();
    pc = stream = null;
    $('go').textContent = t('Share screen'); $('go').className = ''; $('go').disabled = false;
    if (text) say(text, bad);
  }

  async function api(path, opts) {
    const r = await fetch(path, { ...opts, headers: { 'X-Cast-Token': token, 'Content-Type': 'application/json' }, cache: 'no-store' });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'The PC answered with an error.');
    return data;
  }

  function gathered(conn) {
    return new Promise(resolve => {
      if (conn.iceGatheringState === 'complete') return resolve();
      let settled = false, hostTimer = null;
      const done = () => {
        if (settled) return;
        settled = true;
        clearTimeout(hardTimer);
        clearTimeout(hostTimer);
        conn.removeEventListener('icegatheringstatechange', onState);
        conn.removeEventListener('icecandidate', onCand);
        resolve();
      };
      const onState = () => { if (conn.iceGatheringState === 'complete') done(); };
      const onCand = e => {
        if (!e.candidate) done();
        else if (!hostTimer) hostTimer = setTimeout(done, 150);
      };
      const hardTimer = setTimeout(done, 1500);
      conn.addEventListener('icegatheringstatechange', onState);
      conn.addEventListener('icecandidate', onCand);
    });
  }

  async function start() {
    if (pc) { stop('Stopped.'); return; }
    const label = $('name').value.trim().slice(0, 40);
    try { localStorage.setItem('swiftlane-cast-name', label); } catch (e) {}
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 60, max: 60 } }, audio: true });
    } catch (e) { stream = null; say(''); return; }
    $('go').textContent = t('Stop sharing'); $('go').className = 'stop';
    stream.getVideoTracks()[0].addEventListener('ended', () => stop('Stopped.'));
    pc = new RTCPeerConnection({ iceServers: [] });   // home network only: no outside servers
    const conn = pc;
    for (const track of stream.getTracks()) pc.addTransceiver(track, { direction: 'sendonly', streams: [stream] });
    pc.addEventListener('connectionstatechange', () => {
      if (conn !== pc) return;
      if (conn.connectionState === 'connected') showing();
      if (conn.connectionState === 'failed') stop('The connection to the PC was lost.', true);
    });
    try {
      await pc.setLocalDescription(await pc.createOffer());
      await gathered(conn);
      say('Waiting for the PC to allow it…');
      const { id } = await api('/api/cast/offer', { method: 'POST', body: JSON.stringify({ sdp: conn.localDescription.sdp, name: label }) });
      castId = id;
      for (;;) {
        if (conn !== pc) return;
        const s = await api('/api/cast/answer?id=' + encodeURIComponent(id));
        if (s.status === 'answered') { say('Connecting…'); await conn.setRemoteDescription({ type: 'answer', sdp: s.sdp }); watch(id, conn); return; }
        if (s.status === 'denied') return stop('The PC said no.', true);
        if (s.status === 'expired' || s.status === 'unknown') return stop('Nobody answered on the PC. Try again.', true);
        if (s.status === 'ended') return stop('Stopped.');
        await new Promise(r => setTimeout(r, 200));
      }
    } catch (e) { if (conn === pc) stop(e.message, true); }
  }
  // while showing: notice straight away when the PC closes the window or switches casting off
  async function watch(id, conn) {
    while (conn === pc) {
      await new Promise(r => setTimeout(r, 3000));
      if (conn !== pc) return;
      try {
        const s = await api('/api/cast/answer?id=' + encodeURIComponent(id));
        if (s.status !== 'answered') return stop('Stopped.');
      } catch (e) { return stop('Stopped.'); }
    }
  }
  $('go').onclick = start;
})();
</script>
</body>
</html>
