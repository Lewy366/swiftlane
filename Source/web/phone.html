<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swiftlane">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Swiftlane</title>
<style>
  :root {
    --bg: #07070d; --surface: rgba(255,255,255,.055); --surface-2: rgba(255,255,255,.09);
    --border: rgba(255,255,255,.09); --text: #f4f4fb; --muted: #9a9ab3;
    --violet: #7c5cff; --cyan: #00c8ff; --ok: #3ddc97; --err: #ff5d73;
    --grad: linear-gradient(135deg, var(--violet), var(--cyan));
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 var(--sans);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(70px); opacity: .55;
    animation: drift 18s ease-in-out infinite alternate;
  }
  body::before { width: 340px; height: 340px; background: var(--violet); top: -140px; left: -120px; }
  body::after  { width: 300px; height: 300px; background: var(--cyan); bottom: -150px; right: -130px; animation-delay: -9s; opacity: .35; }
  @keyframes drift { to { transform: translate(40px, 60px) scale(1.15); } }

  main { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px); }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  header img { width: 40px; height: 40px; border-radius: 11px; box-shadow: 0 6px 20px rgba(124,92,255,.45); }
  header h1 { font-size: 22px; letter-spacing: -.02em; margin: 0; }
  .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted);
          background: var(--surface); border: 1px solid var(--border); padding: 6px 10px; border-radius: 999px; max-width: 48%; }
  .pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(61,220,151,.6); animation: ping 2s infinite; flex-shrink: 0; }
  .dot.off { background: var(--err); animation: none; }
  @keyframes ping { 70% { box-shadow: 0 0 0 7px rgba(61,220,151,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); } }

  .glass { background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
           backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

  /* pairing */
  #pair { padding: 26px 20px; text-align: center; }
  #pair h2 { margin: 6px 0 6px; font-size: 22px; letter-spacing: -.02em; }
  #pair p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  #code { width: 100%; font: 600 20px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; text-align: center;
          text-transform: uppercase; padding: 16px; border-radius: 14px; border: 1px solid var(--border);
          background: rgba(0,0,0,.35); color: var(--text); outline: none; }
  #code:focus { border-color: var(--violet); box-shadow: 0 0 0 4px rgba(124,92,255,.25); }
  .msg { color: var(--err); font-size: 14px; min-height: 20px; margin: 10px 0 0; }

  .btn { appearance: none; border: 0; font: 600 16px/1 var(--sans); font-family: inherit; color: #fff; cursor: pointer;
         background: var(--grad); border-radius: 14px; padding: 16px 18px; width: 100%; margin-top: 14px;
         box-shadow: 0 10px 30px -10px rgba(124,92,255,.8); transition: transform .15s; text-decoration: none; display: inline-block; text-align: center; }
  .btn:active { transform: scale(.97); }

  /* tabs */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; margin-bottom: 16px; position: relative; }
  .tabs button { position: relative; z-index: 1; appearance: none; background: none; border: 0; color: var(--muted);
                 font: 600 15px/1 var(--sans); font-family: inherit; padding: 12px 8px; border-radius: 11px; cursor: pointer; transition: color .2s; }
  .tabs button.on { color: var(--text); }
  .tabs .slider { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
                  background: var(--surface-2); border-radius: 11px; transition: transform .3s cubic-bezier(.3,.7,.2,1); }
  .tabs.right .slider { transform: translateX(100%); }
  .badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 6px;
           border-radius: 999px; background: var(--grad); color: #fff; font-size: 12px; }
  .badge.pop { animation: pop .5s; }
  @keyframes pop { 40% { transform: scale(1.35); } }

  /* send */
  .drop { display: block; position: relative; overflow: hidden; text-align: center; padding: 34px 20px 30px; cursor: pointer; }
  .drop input { display: none; }
  .orb { width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 50%; background: var(--grad); display: grid; place-items: center;
         box-shadow: 0 14px 40px -8px rgba(124,92,255,.75), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .2s; }
  .drop:active .orb { transform: scale(.93); }
  .orb svg { width: 38px; height: 38px; }
  .drop strong { display: block; font-size: 19px; letter-spacing: -.01em; }
  .drop span { color: var(--muted); font-size: 14px; }

  /* lists */
  .list { margin-top: 14px; padding: 6px 14px; }
  .list:empty { display: none; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .item:first-child { border-top: 0; }
  .kind { width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center;
          font: 700 10.5px/1 var(--sans); letter-spacing: .04em; color: #fff; }
  .k-img { background: linear-gradient(135deg,#8b5cf6,#c084fc); } .k-vid { background: linear-gradient(135deg,#ec4899,#f97316); }
  .k-doc { background: linear-gradient(135deg,#3b82f6,#06b6d4); } .k-pdf { background: linear-gradient(135deg,#ef4444,#f97316); }
  .k-zip { background: linear-gradient(135deg,#f59e0b,#eab308); } .k-aud { background: linear-gradient(135deg,#10b981,#06b6d4); }
  .k-other { background: linear-gradient(135deg,#475569,#64748b); }
  .meta { min-width: 0; flex: 1; }
  .name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .done .sub { color: var(--ok); } .failed .sub { color: var(--err); }
  .bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 4px; transition: width .2s; }
  .save { flex-shrink: 0; width: auto; margin: 0; padding: 10px 14px; font-size: 14px; border-radius: 11px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 24px; font-size: 15px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

  .hint { margin-top: 18px; padding: 14px 16px; font-size: 13.5px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .hint button { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13.5px; display: block; margin: 22px auto 0; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="/icon-180.png" alt="">
    <h1>Swiftlane</h1>
    <div class="pill" id="status" hidden><i class="dot" id="dot"></i><span id="pc">Connected</span></div>
  </header>

  <section id="pair" class="glass" hidden>
    <h2>Pair with your PC</h2>
    <p>Enter the pairing code shown in Swiftlane on your PC.</p>
    <input id="code" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX">
    <button class="btn" id="connect">Connect</button>
    <p class="msg" id="pairMsg"></p>
  </section>

  <section id="app" hidden>
    <nav class="tabs glass" id="tabs">
      <div class="slider"></div>
      <button class="on" data-tab="send">Send to PC</button>
      <button data-tab="inbox">From PC<span class="badge" id="count" hidden>0</span></button>
    </nav>

    <div id="send">
      <label class="drop glass">
        <input type="file" id="files" multiple>
        <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
        <strong>Send files to your PC</strong>
        <span>Photos, videos, documents — any size</span>
      </label>
      <div class="list glass" id="sendList"></div>
    </div>

    <div id="inbox" hidden>
      <div class="list glass" id="inboxList"></div>
      <div class="empty glass" id="inboxEmpty"><b>Nothing waiting</b>Drag files onto Swiftlane on your PC and they'll show up here.</div>
    </div>

    <div class="hint glass" id="hint" hidden>
      <span>Tip: tap <b>Share</b> → <b>Add to Home Screen</b> to use Swiftlane like an app.</span>
      <button id="hideHint" aria-label="Dismiss">×</button>
    </div>
    <button class="link" id="forget">Pair with a different code</button>
  </section>
</main>
<script>
const KEY = 'swiftlane-code';
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let code = store.get(KEY) || store.get('pocketdrop-code') || '';  // stays paired after the rename
if (location.hash.length > 1) code = decodeURIComponent(location.hash.slice(1));
let pollTimer = null, known = new Set(), tab = 'send';

const KINDS = [
  ['k-img', /^(jpe?g|heic|heif|png|gif|webp|bmp|tiff?|dng|raw)$/], ['k-vid', /^(mov|mp4|m4v|avi|mkv|webm|hevc)$/],
  ['k-pdf', /^pdf$/], ['k-zip', /^(zip|rar|7z|tar|gz)$/], ['k-aud', /^(mp3|m4a|wav|aac|flac|ogg)$/],
  ['k-doc', /^(docx?|xlsx?|pptx?|txt|rtf|pages|numbers|key|csv|md)$/],
];
function kindOf(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const k = KINDS.find(([, re]) => re.test(ext));
  return { cls: k ? k[0] : 'k-other', label: (name.includes('.') ? ext : 'file').slice(0, 4).toUpperCase() };
}
function fmt(n) {
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + ' ' + u[i];
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function itemRow(name) {
  const row = el('div', 'item'), k = kindOf(name), meta = el('div', 'meta');
  const badge = el('div', 'kind ' + k.cls, k.label);
  const title = el('div', 'name', name), sub = el('div', 'sub');
  meta.append(title, sub); row.append(badge, meta);
  return { row, meta, sub };
}

// ---------- pairing
async function ping(c) {
  try {
    const r = await fetch('/ping', { headers: { 'X-Token': c }, cache: 'no-store' });
    const body = await r.json().catch(() => ({}));
    if (body.lang) setLang(body.lang);
    return r.ok ? { ok: true, pc: body.pc } : { error: body.error || 'Could not connect.' };
  } catch (e) { return { error: 'Can’t reach your PC. Is Swiftlane open, and are you on the same Wi-Fi?' }; }
}
async function connect(c) {
  const res = c ? await ping(c) : { error: '' };
  if (!res.ok) {
    $('pair').hidden = false; $('app').hidden = true; $('status').hidden = true;
    $('pairMsg').textContent = res.error;
    stopPolling();
    return;
  }
  code = c; store.set(KEY, c);
  // Keep the code in the address so "Add to Home Screen" stays paired.
  history.replaceState(null, '', '/#' + c);
  $('pair').hidden = true; $('app').hidden = false; $('status').hidden = false;
  $('pc').textContent = res.pc ? res.pc : 'Connected'; $('dot').classList.remove('off');
  $('hint').hidden = navigator.standalone || store.get('swiftlane-hint') === 'off';
  startPolling();
}
$('connect').onclick = () => connect($('code').value.trim());
$('code').onkeydown = e => { if (e.key === 'Enter') connect($('code').value.trim()); };
$('forget').onclick = () => { store.del(KEY); code = ''; history.replaceState(null, '', '/'); $('code').value = ''; connect(''); };
$('hideHint').onclick = () => { store.set('swiftlane-hint', 'off'); $('hint').hidden = true; };

// ---------- tabs
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('tabs').classList.toggle('right', tab === 'inbox');
  $('send').hidden = tab !== 'send'; $('inbox').hidden = tab !== 'inbox';
  if (tab === 'inbox') poll();
});

// ---------- send to PC
function upload(file, ui) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open('POST', '/upload?name=' + encodeURIComponent(file.name));
    x.setRequestHeader('X-Token', code);
    x.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      ui.fill.style.width = (100 * e.loaded / e.total) + '%';
      ui.sub.textContent = fmt(e.loaded) + ' of ' + fmt(e.total);
    };
    const finish = (ok, text) => { ui.row.classList.add(ok ? 'done' : 'failed'); ui.sub.textContent = text; ui.bar.remove(); resolve(ok); };
    x.onload = () => {
      let body = {}; try { body = JSON.parse(x.responseText); } catch (e) {}
      x.status === 200 ? finish(true, 'Sent · ' + fmt(file.size)) : finish(false, body.error || 'Failed');
    };
    x.onerror = () => finish(false, 'Connection lost');
    x.send(file);
  });
}
$('files').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  const rows = files.map(f => {
    const ui = itemRow(f.name); ui.sub.textContent = 'Waiting…';
    ui.bar = el('div', 'bar'); ui.fill = el('i'); ui.bar.append(ui.fill); ui.meta.append(ui.bar);
    $('sendList').prepend(ui.row); return ui;
  });
  for (let i = 0; i < files.length; i++) await upload(files[i], rows[i]);
};

// ---------- from PC
async function poll() {
  if (!code || document.hidden) return;
  try {
    const r = await fetch('/api/outbox', { headers: { 'X-Token': code }, cache: 'no-store' });
    if (r.status === 401) return connect('');
    const { items } = await r.json();
    $('dot').classList.remove('off');
    render(items);
  } catch (e) { $('dot').classList.add('off'); }
}
function render(items) {
  const list = $('inboxList'), ids = new Set(items.map(i => i.id));
  const fresh = items.some(i => !known.has(i.id));
  if (!fresh && ids.size === known.size) {
    // Same files: just refresh the expiring links so a tap in progress isn't disturbed.
    list.querySelectorAll('a.save').forEach((a, n) => { a.href = items[n].url; });
    return;
  }
  list.replaceChildren(...items.map(item => {
    const ui = itemRow(item.name); ui.sub.textContent = fmt(item.size);
    const a = el('a', 'btn save', 'Save'); a.href = item.url; a.setAttribute('download', item.name);
    ui.row.append(a); return ui.row;
  }));
  $('inboxEmpty').hidden = items.length > 0;
  const badge = $('count');
  badge.hidden = items.length === 0; badge.textContent = items.length;
  if (fresh && known.size + items.length > 0) { badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop'); }
  known = ids;
}
function startPolling() { stopPolling(); poll(); pollTimer = setInterval(poll, 3000); }
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

// ---------- languages (follows the PC's setting, sent with /ping)
const L = {
  de: { 'Connected': 'Verbunden', 'Pair with your PC': 'Mit dem PC koppeln', 'Enter the pairing code shown in Swiftlane on your PC.': 'Gib den Kopplungscode ein, den Swiftlane auf dem PC zeigt.',
        'Connect': 'Verbinden', 'Send to PC': 'An PC senden', 'From PC': 'Vom PC', 'Send files to your PC': 'Dateien an den PC senden',
        'Photos, videos, documents — any size': 'Fotos, Videos, Dokumente – jede Größe', 'Nothing waiting': 'Nichts da',
        "Drag files onto Swiftlane on your PC and they'll show up here.": 'Zieh Dateien auf Swiftlane am PC, dann erscheinen sie hier.',
        'Tip: tap': 'Tipp: tippe auf', 'Share': 'Teilen', 'Add to Home Screen': 'Zum Home-Bildschirm', 'to use Swiftlane like an app.': ', um Swiftlane wie eine App zu nutzen.',
        'Pair with a different code': 'Mit anderem Code koppeln', 'Waiting…': 'Wartet…', 'Failed': 'Fehlgeschlagen', 'Connection lost': 'Verbindung verloren', 'Save': 'Sichern',
        'Wrong pairing code.': 'Falscher Kopplungscode.', 'Can’t reach your PC. Is Swiftlane open, and are you on the same Wi-Fi?': 'PC nicht erreichbar. Ist Swiftlane offen und bist du im selben WLAN?' },
  pl: { 'Connected': 'Połączono', 'Pair with your PC': 'Sparuj z komputerem', 'Enter the pairing code shown in Swiftlane on your PC.': 'Wpisz kod parowania widoczny w Swiftlane na komputerze.',
        'Connect': 'Połącz', 'Send to PC': 'Wyślij na PC', 'From PC': 'Z komputera', 'Send files to your PC': 'Wyślij pliki na komputer',
        'Photos, videos, documents — any size': 'Zdjęcia, filmy, dokumenty — dowolny rozmiar', 'Nothing waiting': 'Nic nie czeka',
        "Drag files onto Swiftlane on your PC and they'll show up here.": 'Przeciągnij pliki na Swiftlane na komputerze, a pojawią się tutaj.',
        'Tip: tap': 'Wskazówka: stuknij', 'Share': 'Udostępnij', 'Add to Home Screen': 'Do ekranu początkowego', 'to use Swiftlane like an app.': ', aby używać Swiftlane jak aplikacji.',
        'Pair with a different code': 'Sparuj innym kodem', 'Waiting…': 'Czeka…', 'Failed': 'Niepowodzenie', 'Connection lost': 'Utracono połączenie', 'Save': 'Zapisz',
        'Wrong pairing code.': 'Błędny kod parowania.', 'Can’t reach your PC. Is Swiftlane open, and are you on the same Wi-Fi?': 'Brak połączenia z komputerem. Czy Swiftlane jest otwarty i jesteś w tej samej sieci Wi-Fi?' },
  it: { 'Connected': 'Connesso', 'Pair with your PC': 'Associa al PC', 'Enter the pairing code shown in Swiftlane on your PC.': 'Inserisci il codice mostrato da Swiftlane sul PC.',
        'Connect': 'Connetti', 'Send to PC': 'Invia al PC', 'From PC': 'Dal PC', 'Send files to your PC': 'Invia file al PC',
        'Photos, videos, documents — any size': 'Foto, video, documenti — qualsiasi dimensione', 'Nothing waiting': 'Niente in attesa',
        "Drag files onto Swiftlane on your PC and they'll show up here.": 'Trascina i file su Swiftlane sul PC e compariranno qui.',
        'Tip: tap': 'Suggerimento: tocca', 'Share': 'Condividi', 'Add to Home Screen': 'Aggiungi a Home', 'to use Swiftlane like an app.': 'per usare Swiftlane come un’app.',
        'Pair with a different code': 'Associa con un altro codice', 'Waiting…': 'In attesa…', 'Failed': 'Non riuscito', 'Connection lost': 'Connessione persa', 'Save': 'Salva',
        'Wrong pairing code.': 'Codice errato.', 'Can’t reach your PC. Is Swiftlane open, and are you on the same Wi-Fi?': 'PC non raggiungibile. Swiftlane è aperto e sei sulla stessa rete Wi-Fi?' },
};
const LP = {
  de: [[/^Sent · (.+)$/, 'Gesendet · $1'], [/^(.+) of (.+)$/, '$1 von $2']],
  pl: [[/^Sent · (.+)$/, 'Wysłano · $1'], [/^(.+) of (.+)$/, '$1 z $2']],
  it: [[/^Sent · (.+)$/, 'Inviato · $1'], [/^(.+) of (.+)$/, '$1 di $2']],
};
let lang = 'en';
function tr(s) {
  const k = s.trim(), d = L[lang];
  if (!d) return s;
  if (d[k]) return s.replace(k, d[k]);
  for (const [re, rep] of LP[lang]) if (re.test(k)) return s.replace(k, k.replace(re, rep));
  return s;
}
function trNode(n) {
  if (n.nodeType === 3) { if (n.parentElement && !n.parentElement.closest('.name,input,script,style')) { const o = tr(n.nodeValue); if (o !== n.nodeValue) n.nodeValue = o; } return; }
  if (n.nodeType !== 1) return;
  if (n.placeholder) n.placeholder = tr(n.placeholder);
  n.childNodes.forEach(trNode);
}
const trObserver = new MutationObserver(rs => rs.forEach(r => r.type === 'characterData' ? trNode(r.target) : r.addedNodes.forEach(trNode)));
function setLang(l) {
  if (!L[l] || l === lang) return;
  lang = l; document.documentElement.lang = l;
  try { localStorage.setItem('swiftlane-lang', l); } catch (e) {}
  trNode(document.body);
  trObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
}
try { const saved = localStorage.getItem('swiftlane-lang'); if (saved) setLang(saved); } catch (e) {}

connect(code);
</script>
</body>
</html>
